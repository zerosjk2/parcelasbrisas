<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Número</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2em;
      background: #f4f4f4;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 240px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-left: 8px;
    }
    .resultado {
      margin-top: 20px;
      font-size: 18px;
      background: white;
      padding: 16px 20px;
      border-radius: 8px;
      display: inline-block;
      text-align: left;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .resultado strong { color: #2c3e50; }
  </style>
</head>
<body>
  <h2>Consulta tu número</h2>
  <input type="text" id="inputNumero" placeholder="Ingresa tu número (ej: 994338027 o 56994338027)" />
  <button onclick="consultarNumero()">Consultar</button>
  <div class="resultado" id="resultado"></div>

  <script>
    let datos = [];

    fetch('datos1.json')
      .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar datos1.json');
        return response.json();
      })
      .then(data => {
        datos = data;
      })
      .catch(err => {
        document.getElementById('resultado').innerHTML = '❌ Error al cargar datos1.json<br>Asegúrate de que el archivo esté en la misma carpeta.';
      });

    function limpiarNumero(numero) {
      numero = numero.replace(/\D/g, ''); // Solo dígitos

      if (numero.length === 8) {
        return '569' + numero;           // 99999999 → 56999999999
      }
      if (numero.length === 9 && numero.startsWith('9')) {
        return '56' + numero;            // 999999999 → 56999999999
      }
      if (numero.length === 11 && numero.startsWith('56')) {
        return numero;                   // 56999999999
      }
      if (numero.length === 12 && numero.startsWith('569')) {
        return numero.substring(0, 11);
      }
      if (numero.startsWith('569') && numero.length > 11) {
        return numero.substring(0, 11);
      }
      return null;
    }

    function consultarNumero() {
      const input = document.getElementById('inputNumero').value;
      const numeroFormateado = limpiarNumero(input);
      const resultado = document.getElementById('resultado');

      if (!numeroFormateado) {
        resultado.innerHTML = '❌ Número no válido<br>Prueba con 8, 9 u 11 dígitos';
        return;
      }

      // Busca el primero que coincida (si hay repetidos, muestra el primero)
      const encontrado = datos.find(d => d.numero === numeroFormateado);

      if (encontrado) {
        resultado.innerHTML = `
          ✅ Número encontrado<br><br>
          <strong>Orden:</strong> ${encontrado.orden}<br>
          <strong>Número:</strong> ${encontrado.numero}<br>
          <strong>Parcela:</strong> ${encontrado.parcela ?? 'Sin asignar'}<br>
          <strong>Código PDF:</strong> ${encontrado.codigo_pdf || '-'}<br>
          <strong>Todos Códigos PDF:</strong> ${encontrado.todos_codigos_pdf || '-'}<br>
          <strong>Notas:</strong> ${encontrado.notas || '-'}
        `;
      } else {
        resultado.innerHTML = '❌ Número no encontrado';
      }
    }

    // Permite consultar con Enter
    document.getElementById('inputNumero').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') consultarNumero();
    });
  </script>
</body>
</html>
